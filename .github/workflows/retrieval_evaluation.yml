
name: RAG Retrieval Evaluation

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  evaluate-retrieval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --dev

      
      - name: Run RAG retrieval evaluation
        id: evaluation
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: |
          uv run python -m pytest src/evaluation/evaluate_retrieval.py -v -s --junitxml=pytest-results.xml
